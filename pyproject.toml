[project]
name = "ucf-crime-recognition"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "certifi>=2026.4.22",
    "joblib>=1.5.2",
    "kagglehub>=0.3.13",
    "matplotlib>=3.10.9",
    "mlflow>=3.2.0",
    "numpy<2",
    "opencv-python-headless<4.13",
    "optuna>=4.8.0",
    "pandas>=2.3,<3",
    "pillow>=12.0.0",
    "prefect>=3.4.12",
    "scikit-learn>=1.8.0",
    "streamlit>=1.57.0",
    "torch>=2.0,<2.11",
    "torchvision>=0.15,<0.16",
]

[project.scripts]
ucf-download = "ucf_crime_recognition.download:main"
ucf-manifest = "ucf_crime_recognition.manifest:main"
ucf-train = "ucf_crime_recognition.train:main"
ucf-predict = "ucf_crime_recognition.predict:main"
ucf-flow = "ucf_crime_recognition.pipeline:main"

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
