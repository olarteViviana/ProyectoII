name: proyectoii

x-app-base: &app-base
  build:
    context: .
  image: proyectoii-ucf-crime:latest
  env_file:
    - path: .env
      required: false
  environment: &app-environment
    PYTHONUNBUFFERED: "1"
    PYTHONPATH: /app/src
    MLFLOW_TRACKING_URI: sqlite:////app/mlflow-data/mlflow.db
    HF_HOME: /app/.cache/huggingface
    TRANSFORMERS_CACHE: /app/.cache/huggingface/transformers
    TORCH_HOME: /app/.cache/torch
    UV_CACHE_DIR: /app/.cache/uv
  volumes: &app-volumes
    - ./configs:/app/configs:ro
    - ./data:/app/data
    - ./models:/app/models
    - ./reports:/app/reports
    - ./mlruns:/app/mlruns
    - mlflow-db:/app/mlflow-data
    - hf-cache:/app/.cache/huggingface
    - torch-cache:/app/.cache/torch
    - uv-cache:/app/.cache/uv

services:
  api:
    <<: *app-base
    command:
      - uvicorn
      - ucf_crime_recognition.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  dashboard:
    <<: *app-base
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    restart: unless-stopped

  mlflow:
    <<: *app-base
    command:
      - mlflow
      - ui
      - --backend-store-uri
      - sqlite:////app/mlflow-data/mlflow.db
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    ports:
      - "5001:5000"
    restart: unless-stopped

  train:
    <<: *app-base
    profiles:
      - train
    command:
      - ucf-flow
      - --rebuild-manifest

volumes:
  hf-cache:
  mlflow-db:
  torch-cache:
  uv-cache:
