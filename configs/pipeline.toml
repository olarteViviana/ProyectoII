[dataset]
kaggle_slug = "odins0n/ucf-crime-dataset"
raw_dir = "data/raw"
manifest_path = "data/processed/manifest.csv"

[preprocessing]
image_size = 96
color_mode = "rgb"
test_size = 0.2
validation_size = 0.25
random_state = 42

[model]
output_path = "models/ucf_crime_baseline.joblib"
multi_output = true
max_iter = 300
class_weight = "balanced"
max_train_samples = 6000
max_validation_samples = 800
max_test_samples = 800
min_train_samples_per_class = 150
max_train_samples_per_class = 500
candidate_models = [
    "logistic_regression",
    "linear_svm",
    "extra_trees",
    "random_forest",
]
selection_metric = "f1_macro"

[model.threshold_search]
min = 0.05
max = 0.95
steps = 19

[reports]
classification_report = "reports/classification_report.txt"
confusion_matrix = "reports/confusion_matrix.csv"
experiment_summary = "reports/experiment_summary.csv"

[optuna]
enabled = true
n_trials = 48
timeout_seconds = 1800

[mlflow]
tracking_uri = "sqlite:///mlflow.db"
experiment_name = "ucf-crime-recognition"

[registry]
enabled = true
model_name = "ucf-crime-image-classifier"
